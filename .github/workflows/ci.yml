name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Validate and test the mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate ./ci-status

      - name: Run the mod tests
        run: claude plugin test ./ci-status
